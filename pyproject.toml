[project]
name = "shikari"
version = "0.1.0"
description = "AI-powered MCP server for ethical hackers and penetration testers — 1000+ security tools, 50 AI subagents, dual transport"
readme = "README.md"
authors = [
    { name = "Zaeem20", email = "duranizaeem@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
shikari = "shikari.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
