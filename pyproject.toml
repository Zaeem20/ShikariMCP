[project]
name = "shikari"
version = "0.2.0"
description = "Local-first MCP server that lets AI systems orchestrate verified security tools with stdio and HTTP transport"
readme = "README.md"
authors = [
    { name = "Zaeem20", email = "duranizaeem@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.1.1,<4",
    "python-dotenv>=1.1.0,<2",
    "pydantic>=2.11.0,<3",
    "starlette>=0.40,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
shikari-mcp = "shikari.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.12.0",
]
