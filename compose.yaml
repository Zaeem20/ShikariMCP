name: shikari

services:
  shikari:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: shikari:local
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "${SHIKARI_BIND_ADDR:-127.0.0.1}:${SHIKARI_PORT:-8080}:8080"
    environment:
      SHIKARI_TRANSPORT: streamable-http
      SHIKARI_HOST: 0.0.0.0
      SHIKARI_PORT: 8080
      SHIKARI_API_KEY: ${SHIKARI_API_KEY:?Set SHIKARI_API_KEY in .env}
      SHIKARI_LOCAL_MODE: ${SHIKARI_LOCAL_MODE:-true}
      SHIKARI_TOOL_PROFILE: ${SHIKARI_TOOL_PROFILE:-core}
      SHIKARI_TIMEOUT: ${SHIKARI_TIMEOUT:-300}
      SHIKARI_MAX_CONCURRENT: ${SHIKARI_MAX_CONCURRENT:-10}
      SHIKARI_MAX_OUTPUT_CHARS: ${SHIKARI_MAX_OUTPUT_CHARS:-50000}
      SHIKARI_MAX_PARSER_BYTES: ${SHIKARI_MAX_PARSER_BYTES:-10000000}
      SHIKARI_MAX_BACKGROUND_RUNS: ${SHIKARI_MAX_BACKGROUND_RUNS:-100}
      SHIKARI_MAX_INPUT_CHARS: ${SHIKARI_MAX_INPUT_CHARS:-1000000}
      SHIKARI_MAX_TARGETS_PER_RUN: ${SHIKARI_MAX_TARGETS_PER_RUN:-5000}
      SHIKARI_HTTP_ALLOWED_HOSTS: ${SHIKARI_HTTP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
      SHIKARI_ENABLE_LEGACY_TOOLS: "false"
      SHIKARI_ENABLE_GENERATED_TOOLS: "false"
      SHIKARI_ENABLE_EXPERIMENTAL_TOOLS: "false"
      SHIKARI_ENABLE_REMOTE_ACTIVE_TOOLS: "false"
      SHIKARI_ENABLE_ACTIVE_TOOLS: ${SHIKARI_ENABLE_ACTIVE_TOOLS:-false}
      SHIKARI_ENABLE_OFFENSIVE_TOOLS: "false"
      SHIKARI_ENABLE_CREDENTIAL_TOOLS: "false"
      SHIKARI_TARGET_ALLOWLIST: ${SHIKARI_TARGET_ALLOWLIST:-}
      SHIKARI_ARTIFACT_DIR: /app/.shikari/artifacts
      SHIKARI_AUDIT_ENABLED: "true"
      SHIKARI_AUDIT_LOG_PATH: /app/.shikari/audit.jsonl
      SHIKARI_LOG_LEVEL: ${SHIKARI_LOG_LEVEL:-INFO}
    volumes:
      - shikari-data:/app/.shikari
      - shikari-home:/home/shikari
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8080), 3); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  shikari-data:
  shikari-home:
