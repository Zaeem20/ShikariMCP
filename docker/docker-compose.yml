# =============================================================================
# ShikariMCP - Docker Compose
# =============================================================================
#
# Local-first usage:
#   1. Set SHIKARI_API_KEY in .env or your shell.
#   2. Run: docker compose up -d
#   3. Connect your MCP client to http://127.0.0.1:${SHIKARI_PORT:-8080}/mcp
#
# The container listens on 0.0.0.0 internally so Docker port publishing works,
# but the host binding defaults to 127.0.0.1.
#

services:
  shikari:
    profiles: ["core", "default"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: shikari-mcp
    restart: unless-stopped

    ports:
      - "${SHIKARI_BIND_ADDR:-127.0.0.1}:${SHIKARI_PORT:-8080}:8080"

    environment:
      - SHIKARI_TRANSPORT=streamable-http
      - SHIKARI_HOST=0.0.0.0
      - SHIKARI_PORT=8080
      - SHIKARI_API_KEY=${SHIKARI_API_KEY:?Set SHIKARI_API_KEY before running docker compose}
      - SHIKARI_LOCAL_MODE=${SHIKARI_LOCAL_MODE:-true}
      - SHIKARI_TIMEOUT=${SHIKARI_TIMEOUT:-300}
      - SHIKARI_MAX_CONCURRENT=${SHIKARI_MAX_CONCURRENT:-10}
      - SHIKARI_MAX_OUTPUT_CHARS=${SHIKARI_MAX_OUTPUT_CHARS:-50000}
      - SHIKARI_TOOL_PROFILE=${SHIKARI_TOOL_PROFILE:-core}
      - SHIKARI_ENABLE_GENERATED_TOOLS=${SHIKARI_ENABLE_GENERATED_TOOLS:-false}
      - SHIKARI_ENABLE_EXPERIMENTAL_TOOLS=${SHIKARI_ENABLE_EXPERIMENTAL_TOOLS:-false}
      - SHIKARI_REQUIRE_TOOL_DEPENDENCIES=${SHIKARI_REQUIRE_TOOL_DEPENDENCIES:-false}
      - SHIKARI_ENABLE_REMOTE_ACTIVE_TOOLS=${SHIKARI_ENABLE_REMOTE_ACTIVE_TOOLS:-false}
      - SHIKARI_ENABLE_ACTIVE_TOOLS=${SHIKARI_ENABLE_ACTIVE_TOOLS:-false}
      - SHIKARI_ENABLE_OFFENSIVE_TOOLS=${SHIKARI_ENABLE_OFFENSIVE_TOOLS:-false}
      - SHIKARI_ENABLE_CREDENTIAL_TOOLS=${SHIKARI_ENABLE_CREDENTIAL_TOOLS:-false}
      - SHIKARI_TARGET_ALLOWLIST=${SHIKARI_TARGET_ALLOWLIST:-}
      - SHIKARI_AUDIT_ENABLED=${SHIKARI_AUDIT_ENABLED:-true}
      - SHIKARI_AUDIT_LOG_PATH=/app/.shikari/audit.jsonl
      - SHIKARI_LOG_LEVEL=${SHIKARI_LOG_LEVEL:-INFO}

    volumes:
      - wordlists:/opt/wordlists:ro
      - shikari-output:/app/output
      - shikari-audit:/app/.shikari

    cap_drop:
      - ALL
    cap_add:
      - NET_RAW

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 512M

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,socket; s=socket.create_connection(('127.0.0.1', int(os.getenv('SHIKARI_PORT', '8080'))), 5); s.close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  wordlists:
    driver: local
  shikari-output:
    driver: local
  shikari-audit:
    driver: local
